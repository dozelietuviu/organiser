<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06121b">
<title>Organiser</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="title">Today</h1>
  <button class="icon" id="btnSettings" aria-label="Settings">⚙︎</button>
</header>
<div id="sheetNote" class="note info sheet" hidden></div>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="today" class="on"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20 3.5 10.5a8.5 8.5 0 0 1 17 0Z"/><path d="M12 20 7 5.2M12 20V3.5M12 20l5-14.8M12 20 4.2 8M12 20l7.8-12"/><path d="M10 20h4l-.5 1.5h-3z"/></svg></span>Today</button>
  <button data-tab="food"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13a9 9 0 0 1 18 0Z"/><path d="M3 13c2 4.5 16 4.5 18 0"/><path d="M8 13 6.5 6.5M12 13V4.5M16 13l1.5-6.5"/></svg></span>Food</button>
  <button data-tab="train"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c-1-5 1-11 7-15 1.5 4 6 6 7 9-2 4-8 7-14 6Z"/><path d="M8.5 15.5c2-1 5-1 7-2.5M7.5 11.5c2.5-.5 5-2 6.5-4"/></svg></span>Train</button>
  <button data-tab="body"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12A8.5 8.5 0 1 1 12 3.5c4 0 7 3 7 6.5s-2.6 5.5-5.5 5.5S9 13.7 9 11.5s1.6-3.5 3.5-3.5 3 1.3 3 2.8-1 2.2-2.2 2.2"/></svg></span>Body</button>
  <button data-tab="goals"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c1 3.3 1.8 5.4 3.2 6.2 1.6.8 3.6.3 6-.3-2 2.1-3.5 3.5-3.4 5.1.1 1.6 1.4 3.6 2.6 6-2.5-1.4-4.6-2.4-6.4-2.4s-3.9 1-6.4 2.4c1.2-2.4 2.5-4.4 2.6-6 .1-1.6-1.4-3-3.4-5.1 2.4.6 4.4 1.1 6-.3 1.4-.8 2.2-2.9 3.2-6.2Z"/></svg></span>Goals</button>
</nav>
<dialog id="dlg"><form method="dialog" id="dlgBody"></form></dialog>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
