<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a22">
<title>Organiser</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="title">Today</h1>
  <button class="icon" id="btnSettings" aria-label="Settings">⚙︎</button>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-tab="today" class="on"><span>☀︎</span>Today</button>
  <button data-tab="food"><span>🍳</span>Food</button>
  <button data-tab="train"><span>🥊</span>Train</button>
  <button data-tab="progress"><span>📉</span>Progress</button>
  <button data-tab="plan"><span>🗓</span>Plan</button>
</nav>

<dialog id="dlg"><form method="dialog" id="dlgBody"></form></dialog>
<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
